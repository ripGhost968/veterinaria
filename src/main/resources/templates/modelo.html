<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modelo | Clínica Veterinária</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/menu :: menu}"></div><main class="container py-5"><header class="page-heading mb-5"><p class="eyebrow mb-2">Página de exemplo</p><h1 class="h2 fw-bold text-primary-custom">Título da página</h1><p class="text-muted">Use este modelo como base para novas páginas da clínica.</p></header><section class="card border-0 rounded-4 mb-5"><div class="card-body p-4 p-lg-5"><h2 class="h4 fw-bold">Informações</h2><p class="text-secondary mb-0">Adicione aqui o conteúdo e as orientações importantes para os clientes da clínica.</p></div></section><section class="mb-5"><h2 class="h4 fw-bold mb-3">Exemplo de formulário</h2><form th:action="@{/exemplo/salvar}" method="post" class="card border-0 rounded-4"><div class="card-body p-4"><div class="row g-3"><div class="col-12 col-md-6"><label for="nome" class="form-label">Nome</label><input id="nome" name="nome" class="form-control" placeholder="Nome do tutor"></div><div class="col-12 col-md-6"><label for="email" class="form-label">E-mail</label><input id="email" name="email" type="email" class="form-control" placeholder="voce@exemplo.com"></div><div class="col-12"><label for="observacao" class="form-label">Observação</label><textarea id="observacao" name="observacao" class="form-control" rows="3"></textarea></div><div class="col-12"><button type="submit" class="btn btn-primary-custom">Salvar</button></div></div></div></form></section></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script></body></html>
