<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Serviços veterinários disponíveis na clínica."><title>Serviços | Clínica Veterinária</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/menu :: menu}"></div><main class="container py-5"><header class="page-heading mb-5"><p class="eyebrow mb-2">Cuidado para cada fase da vida</p><h1 class="h2 fw-bold text-primary-custom mb-2">Nossos serviços</h1><p class="text-muted mb-0">Conheça os cuidados que oferecemos para a saúde e o bem-estar do seu pet.</p></header><section aria-label="Serviços veterinários"><div class="row g-4"><div class="col-12 col-md-6 col-lg-4" th:each="servico, iter : ${servicos}"><article class="service-card card h-100 border-0 rounded-4 overflow-hidden"><div class="service-placeholder" aria-hidden="true"><span th:text="${iter.index == 0 ? '♡' : (iter.index == 1 ? '✚' : '🐾')}">♡</span></div><div class="card-body p-4 d-flex flex-column"><h2 class="h5 fw-bold mb-2" th:text="${servico.nome}">Consulta veterinária</h2><p class="text-secondary flex-grow-1" th:text="${servico.descricao}">Descrição do serviço.</p><p class="service-price fw-bold" th:text="|R$ ${#numbers.formatDecimal(servico.preco,1,'COMMA',2,'POINT')}|">R$ 90,00</p><a th:href="@{/agendamentos}" class="btn btn-outline-primary rounded-pill w-100">Agendar</a></div></article></div></div><div th:if="${#lists.isEmpty(servicos)}" class="alert alert-info">Os serviços estarão disponíveis em breve.</div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script></body></html>
