<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Inicie seu cadastro na Clínica Veterinária."><title>Cadastro | Clínica Veterinária</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/menu :: menu}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-9"><section class="register-card card border-0 rounded-4 overflow-hidden"><header class="register-header p-4 p-md-5"><p class="eyebrow text-white-50 mb-2">Faça parte da nossa clínica</p><h1 class="h3 text-white fw-bold mb-2">Criar sua conta</h1><p class="text-white-50 mb-0">Cadastre seus dados para agendar e acompanhar os cuidados do seu pet.</p></header><div class="card-body p-4 p-md-5"><form th:action="@{/cadastro}" th:object="${form}" method="post"><div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">Verifique os campos destacados e tente novamente.</div><fieldset class="mb-4"><legend class="form-section-title">Seus dados</legend><div class="row g-3"><div class="col-12"><label for="nome" class="form-label">Nome completo</label><input id="nome" th:field="*{nome}" class="form-control" autocomplete="name" required><div class="text-danger small" th:errors="*{nome}"></div></div><div class="col-12 col-md-6"><label for="email" class="form-label">E-mail</label><input id="email" type="email" th:field="*{email}" class="form-control" autocomplete="email" required><div class="text-danger small" th:errors="*{email}"></div></div><div class="col-12 col-md-6"><label for="telefone" class="form-label">Telefone</label><input id="telefone" th:field="*{telefone}" class="form-control" autocomplete="tel" placeholder="(00) 00000-0000"></div><div class="col-12 col-md-6"><label for="cpf" class="form-label">CPF <span class="text-muted fw-normal">(opcional)</span></label><input id="cpf" th:field="*{cpf}" class="form-control" inputmode="numeric" placeholder="Somente números"></div><div class="col-12 col-md-6"><label for="endereco" class="form-label">Cidade ou endereço <span class="text-muted fw-normal">(opcional)</span></label><input id="endereco" th:field="*{endereco}" class="form-control" autocomplete="street-address"></div></div></fieldset><fieldset><legend class="form-section-title">Segurança da conta</legend><div class="row g-3"><div class="col-12 col-md-6"><label for="senha" class="form-label">Senha</label><input id="senha" type="password" th:field="*{senha}" class="form-control" minlength="8" autocomplete="new-password" required><div class="form-text">Mínimo de 8 caracteres.</div><div class="text-danger small" th:errors="*{senha}"></div></div><div class="col-12 col-md-6"><label for="confirmarSenha" class="form-label">Confirmar senha</label><input id="confirmarSenha" type="password" th:field="*{confirmarSenha}" class="form-control" minlength="8" autocomplete="new-password" required><div class="text-danger small" th:errors="*{confirmarSenha}"></div></div></div></fieldset><div class="d-flex flex-wrap justify-content-end gap-2 mt-4"><a th:href="@{/login}" class="btn btn-outline-secondary">Já tenho conta</a><button type="submit" class="btn btn-primary-custom">Criar cadastro</button></div></form></div></section></div></div></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script></body></html>
