<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Acesse sua conta na Clínica Veterinária."><title>Entrar | Clínica Veterinária</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/menu :: menu}"></div><main class="auth-page container py-5"><div class="row justify-content-center w-100"><div class="col-12 col-md-8 col-lg-5 col-xl-4"><section class="auth-card card border-0 rounded-4"><div class="card-body p-4 p-md-5"><div class="auth-mark" aria-hidden="true">♡</div><h1 class="h3 fw-bold text-center mb-2">Bem-vindo de volta</h1><p class="text-muted text-center mb-4">Entre para acompanhar os cuidados do seu pet.</p><div th:if="${param.error}" class="alert alert-danger" role="alert">E-mail ou senha inválidos.</div><div th:if="${param.sair}" class="alert alert-success" role="status">Você saiu do sistema.</div><div th:if="${param.cadastro}" class="alert alert-success" role="status">Cadastro realizado! Entre com seu e-mail e senha.</div><form th:action="@{/login}" method="post"><div class="mb-3"><label for="email" class="form-label">E-mail</label><input id="email" name="email" type="email" class="form-control" autocomplete="email" placeholder="voce@exemplo.com" required></div><div class="mb-4"><label for="senha" class="form-label">Senha</label><input id="senha" name="senha" type="password" class="form-control" autocomplete="current-password" placeholder="Sua senha" required></div><button class="btn btn-primary-custom w-100 py-2" type="submit">Entrar</button></form><div class="text-center mt-4"><p class="text-muted mb-1">Ainda não tem cadastro?</p><a th:href="@{/cadastro}" class="fw-semibold">Criar minha conta</a></div></div></section></div></div></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script></body></html>
